[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-bot"
version = "0.1.0"
description = "Marketing-Bot (Custom ArtBOT): Innodata PR & Market Intelligence agent using Agility PR MCP and daily roundup generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
marketing-bot = "marketing_bot.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p randomly --cov=marketing_bot --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["marketing_bot"]

[tool.coverage.report]
fail_under = 100
show_missing = true
